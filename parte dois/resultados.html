<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Foto flete 2.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">
    <title>PB Aluguel</title>
</head>
<body>
    <h1>
          <img src="Foto flete 2.png" alt="PB Aluguel" class="logo-cabecalho2">
    </h1>
    
    <p><strong>Opções para Aluguel:</strong>Casas,Apartamentos e Fletes</p> 
    <hr>
    <form action="resultados.html" class="barra-busca">
  <!-- Campo 1: Onde -->
  <div class="campo-busca">
    <label for="onde">Onde</label>
    <input type="text" id="onde" placeholder="Buscar destinos">
  </div>

  <div class="divisor"></div>

  <!-- Campo 2: Quando -->
  <div class="campo-busca">
    <label for="quando">Quando</label>
    <input type="text" id="quando" placeholder="Insira as datas">
  </div>

  <div class="divisor"></div>

  <!-- Campo 3: Quem -->
  <div class="campo-busca">
    <label for="quem">Quem</label>
    <input type="text" id="quem" placeholder="Hóspedes?">
  </div>

  <!-- Botão de Lupa -->
  <button type="submit" class="btn-buscar">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </button>
</form>
<!--Segunda parte do codigo-->
<header class="header-site">
  <!-- Logo / Nome da Marca (Com a sua Imagem) -->
  <a href="index.html" class="logo">
    <img src="logo tipo aluguel.png" alt="PB ALUGUEL" class="img-logo">
  </a>

  <!-- Menu Central / Links -->
  <nav class="nav-links">
    <a href="#">Anuncie seu imóvel</a>
    <a href="#">Ajuda</a>
  </nav>

  <!-- Menu do Usuário (Direita) -->
  <div class="user-menu">
    <button type="button" class="btn-usuario">
      <!-- Ícone Hamburger (3 linhas) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="menu-icon">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      
      <!-- Avatar de Perfil -->
      <div class="avatar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
    </button>
  </div>
</header>
</section>
<!-- Barra de Categorias -->
<div class="container-categorias">
  <button class="item-categoria ativo">
    <span class="icone-categoria">🏖️</span>
    <span class="rotulo-categoria">Beira-mar</span>
  </button>

  <button class="item-categoria">
    <span class="icone-categoria">🏊</span>
    <span class="rotulo-categoria">Com Piscina</span>
  </button>

  <button class="item-categoria">
    <span class="icone-categoria">🐾</span>
    <span class="rotulo-categoria">Pet Friendly</span>
  </button>

  <button class="item-categoria">
    <span class="icone-categoria">🏢</span>
    <span class="rotulo-categoria">Flats & Fletes</span>
  </button>

  <button class="item-categoria">
    <span class="icone-categoria">🌿</span>
    <span class="rotulo-categoria">Casas de Campo</span>
  </button>

  <button class="item-categoria">
    <span class="icone-categoria">⚡</span>
    <span class="rotulo-categoria">Reserva Instantânea</span>
  </button>
</div>
</body>
</html>

Esta coerente, apresenta framework de html e css
Etruturado e facil para leitura
Executa muito bem
