<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Aluguel de Casas</h1>
    
     <p><strong>Opções para Aluguel:</strong>Casas,Apartamentos e Fletes</p> 
    
    <hr>
    <body class="body_one">
    <div class="Card-busca">
        <h2>Encontre lugares para alugar</h2>
        <p class="Subtitulo">Descubra lugares para alugar!casas, apartamentos e fletes nesse site!</p>
        <form>
            <!---localização-->    
            <div class="campo_localizacao">
            <label for="localização">Localização</label>
            <input id="localização" placeholder="Perto de Você" type="text">
            </div>
            <!--Insirir os Nomes-->
            <div class="linha_dupla">
                <div class="campo_Nome">
                    <label for="nome">Nome</label>
                     <input id="nome" type="text" placeholder="Insira o Nome">
                </div>
                <div class="campo_cpf">
                    <label for="cpf">CPF</label>
                    <input type="text" placeholder="Insira o CPF" id="cpf">
                </div>
            </div>
            <button type="submit" class="buscar">Buscar</button>

            
        </form>
    </div>
    
    </body>
</body>
</html>
